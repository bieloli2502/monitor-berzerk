name: Monitor Berzerk

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar requests
        run: pip install requests

      - name: Rodar verificação
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python berzerk_bot.py

      - name: Salvar histórico atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add berzerk_estado.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza catalogo" && git push)
